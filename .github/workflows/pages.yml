name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A CNAME file in the repo root means a custom domain: the site lives at "/".
      # Otherwise GitHub serves it under /reina-site/.
      - name: Build
        run: |
          if [ -f CNAME ]; then
            export PATHPREFIX=/
            export SITE_URL="https://$(cat CNAME)"
          else
            export PATHPREFIX=/reina-site/
            export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          fi
          echo "Building with PATHPREFIX=$PATHPREFIX SITE_URL=$SITE_URL"
          npm run build
          [ -f CNAME ] && cp CNAME _site/CNAME || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
